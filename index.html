n Olive Oil 'ORO' 5L",description:"Italian extra virgin olive oil from the hills of Subasio. A natural and genuine EVO, cold-pressed, with a balanced and versatile flavor, ideal both raw and for cooking. In a practical 5-liter format, it’s the perfect choice for families and restaurateurs looking for quality, convenience, and Umbrian authenticity."},ro:{name:"Ulei de măsline extravirgin 'ORO' 5L",description:"Ulei de măsline extravirgin italian, provenit din colinele Subasio. Un EVO natural și autentic, extras la rece, cu un gust echilibrat și versatil, ideal atât crud, cât și pentru gătit. În formatul practic de 5 litri, este alegerea perfectă pentru familii și restaurante care caută calitate, conveniență și autenticitate umbriană."},es:{name:"Aceite de Oliva Virgen Extra 'ORO' 5L",description:"Aceite de oliva virgen extra italiano, de las colinas del Subasio. Un EVO natural y genuino, extraído en frío, con un sabor equilibrado y versátil, ideal tanto en crudo como para cocinar. En un práctico formato de 5 litros, es la elección perfecta para familias y restauradores que buscan calidad, conveniencia y autenticidad de Umbría."}}},{id:"690f13c369e3610ea9b1e17f",name:"Olio EVO Premium 'Sien Die' 750ml",category:"extra_virgin_olive_oil",price:45.95,image:"https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/690def7378e8f85386a1132d/18e805e11_Olio-EVO-Premium-Sien-Die-750ml.jpg",description:"Olio extravergine di oliva di qualità superiore, prodotto in quantità limitata. Aromatico e intenso, con note di erbe fresche e mandorla, ideale per piatti gourmet, crudité, carni pregiate e insalate. Scelto da chef e appassionati per il suo sapore autentico e premiato.",volume:"750ml",origin:"Umbria, Italia",featured:!0,stock:30,translations:{no:{name:"Premium EVO-olje 'Sien Die' 750ml",description:"Ekstra virgin olivenolje av høyeste kvalitet, produsert i begrensede mengder. Aromatisk og intens, med hint av friske urter og mandel, ideell til gourmetretter, crudités, edelt kjøtt og salater. Valgt av kokker og entusiaster for sin autentiske smak og prisbelønte kvalitet."},en:{name:"Premium EVO Oil 'Sien Die' 750ml",description:"Superior quality extra virgin olive oil, produced in limited quantities. Aromatic and intense, with notes of fresh herbs and almond, ideal for gourmet dishes, crudités, premium meats, and salads. Chosen by chefs and enthusiasts for its authentic flavor and award-winning quality."},ro:{name:"Ulei EVO Premium 'Sien Die' 750ml",description:"Ulei de măsline extravirgin de calitate superioară, produs în cantități limitate. Aromat și intens, cu note de ierburi proaspete și migdale, ideal pentru preparate gourmet, crudités, carne de calitate și salate. Alegerea bucătarilor și pasionaților pentru gustul său autentic și calitatea premiată."},es:{name:"Aceite EVO Premium 'Sien Die' 750ml",description:"Aceite de oliva virgen extra de calidad superior, producido en cantidades limitadas. Aromático e intenso, con notas de hierbas frescas y almendra, ideal para platos gourmet, crudités, carnes selectas y ensaladas. Elegido por chefs y aficionados por su sabor auténtico y calidad premiada."}}},{id:"690f13c369e3610ea9b1e182",name:"Olio Extravergine di Oliva Biologico 500ml",category:"extra_virgin_olive_oil",price:29.75,image:"https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/690def7378e8f85386a1132d/128f960c8_Olio-Extravergine-di-Oliva-Biologico-500ml.jpg",description:"Olio extravergine di oliva biologico certificato. Coltivato con metodi naturali, senza pesticidi o fertilizzanti chimici. Purezza e autenticità in ogni goccia.",volume:"500ml",origin:"Italia",stock:60,translations:{no:{name:"Økologisk Ekstra Virgin Olivenolje 500ml",description:"Sertifisert økologisk ekstra virgin olivenolje. Dyrket med naturlige metoder, uten plantevernmidler eller kjemisk gjødsel. Italiensk renhet og autentisitet i hver dråpe."},en:{name:"Organic Extra Virgin Olive Oil 500ml",description:"Certified organic extra virgin olive oil. Cultivated using natural methods, without pesticides or chemical fertilizers. Italian purity and authenticity in every drop."},ro:{name:"Ulei de măsline extravirgin bio 500ml",description:"Ulei de măsline extravirgin bio certificat. Cultivat prin metode naturale, fără pesticide sau îngrășăminte chimice. Puritate și autenticitate italiană în fiecare picătură."},es:{name:"Aceite de Oliva Virgen Extra Ecológico 500ml",description:"Aceite de oliva virgen extra orgánico certificado. Cultivado con métodos naturales, sin pesticidas ni fertilizantes químicos. Pureza y autenticidad italiana en cada gota."}}},{id:"6914b82805cfed02a50a7da4",name:"Olio EVO Blend Bio Ronci 500ml",category:"extra_virgin_olive_oil",price:19.95,image:"https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/690def7378e8f85386a1132d/c168e4436_olio-blend-bio.jpg",description:"Olio extravergine di oliva biologico blend premium. Sapore equilibrato e versatile, perfetto per uso quotidiano. Certificato biologico.",volume:"500ml",origin:"Italia - Umbria",featured:!0,stock:100,translations:{no:{name:"Økologisk EVO Blend Ronci 500ml",description:"Premium økologisk ekstra virgin olivenolje-blanding. Balansert og allsidig smak, perfekt til daglig bruk. Økologisk sertifisert."},en:{name:"Organic EVO Blend Ronci 500ml",description:"Premium organic extra virgin olive oil blend. Balanced and versatile flavor, perfect for daily use. Organic certified."},ro:{name:"Blend Organic EVO Ronci 500ml",description:"Amestec premium de ulei de măsline extravirgin organic. Gust echilibrat și versatil, perfect pentru uz zilnic. Certificat organic."},es:{name:"Blend Orgánico EVO Ronci 500ml",description:"Mezcla de aceite de oliva virgen extra orgánico premium. Sabor equilibrado y versátil, perfecto para uso diario. Certificado orgánico."}}},{id:"690f13c369e3610ea9b1e185",name:"Olio Extravergine Monocultivar Frantoio 500ml",category:"extra_virgin_olive_oil",
